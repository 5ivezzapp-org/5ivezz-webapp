name: Deploy to Hostinger

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, fileinfo, zip
        coverage: none
    
    - name: Install Composer dependencies
      run: composer install --no-dev --prefer-dist --no-progress --no-interaction
    
    - name: Create deployment zip
      run: |
        # Create zip of everything except unnecessary files
        zip -r deploy.zip . \
          -x "*.git/*" \
          -x "*.github/*" \
          -x "node_modules/*" \
          -x "tests/*" \
          -x "storage/logs/*" \
          -x ".env" \
          -x ".gitignore" \
          -x "composer.json" \
          -x "composer.lock" \
          -x "package.json" \
          -x "package-lock.json" \
          -x "phpunit.xml" \
          -x "README.md" \
          -x "deploy.zip"
    
    - name: Deploy via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftp
        port: 21
        local-dir: ./
        server-dir: public_html/
        passive: true
        exclude: |
          .git/**
          .github/**
          .env
          node_modules/**
          tests/**
          storage/logs/**
          .gitignore
          composer.json
          composer.lock
          package.json
          package-lock.json
          phpunit.xml
          README.md
          deploy.zip
          .env.example
          .editorconfig
          .gitattributes
          docker-compose.yml
          dockerfile
          vite.config.js
          tailwind.config.js
          postcss.config.js
          webpack.mix.js